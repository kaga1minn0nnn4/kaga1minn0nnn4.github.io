<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | My Name</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2d3436;
            --accent-color: #0984e3;
            --bg-color: #f5f6fa;
            --text-color: #2d3436;
        }

        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.6;
            margin: 0;
            color: var(--text-color);
            background-color: var(--bg-color);
        }

        header {
            background: #fff;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* プロフィール部分 */
        .profile {
            text-align: center;
            margin-bottom: 3rem;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%; /* 写真を丸く切り抜き */
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
        }

        /* セクション共通 */
        section {
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
            margin-bottom: 1.5rem;
            padding-bottom: 0.3rem;
        }

        /* スキルリスト */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            text-align: center;
        }

        .skill-item {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
        }

        /* 制作物一覧 */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-info {
            padding: 1rem;
        }

        .project-tags {
            font-size: 0.8rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            display: block;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #636e72;
        }

        /* レスポンシブ対応 */
        @media (max-width: 600px) {
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
    </header>

    <div class="container">
        <section class="profile">
            <img src="profile.jpg" alt="Your Name" class="profile-img">
            <h2>あなたの名前 / Your Name</h2>
            <p>ここに簡単な略歴を記載します。例：大学でロボット工学を専攻し、現在はSTM32を用いた組み込み開発やPythonによるデータ解析を行っています。</p>
        </section>
